# Fly.io settings for the Salat server. Used on Friday, when the Fly key arrives.
# First time:  fly launch --no-deploy --copy-config
#              fly volumes create salat_data --size 1
#              fly secrets set VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBJECT=mailto:...
# Then:        fly deploy
app = "salat-server"
primary_region = "ewr"

[build]
  dockerfile = "server/Dockerfile"

[env]
  ALLOWED_ORIGINS = "https://squashblossom.github.io,http://localhost:5173,http://localhost:4173"

[mounts]
  source = "salat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the alert clock must keep running
  auto_start_machines = true
  min_machines_running = 1

[checks.health]
  type = "http"
  port = 8080
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
